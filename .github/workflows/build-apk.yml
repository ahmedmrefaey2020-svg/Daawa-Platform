name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21}
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/ 2>/dev/null || true
      - name: Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init "منصة دعوة" com.dawa.platform --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Adhan sound + permissions
        run: |
          RAW=android/app/src/main/res/raw
          mkdir -p $RAW
          test -f adhan.mp3 || { echo "ضع ملف adhan.mp3 في جذر المستودع"; exit 1; }
          cp adhan.mp3 $RAW/adhan.mp3
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED WAKE_LOCK VIBRATE; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dawa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
